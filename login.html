<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <title>Login - RTV Solar</title>
</head>

<body>
    <header class="nav-bar">
        <a href="index.html">
            <img src="imagens/logo-site.png" alt="logo" class="logo">
            <h3>RTV ENERGIA SOLAR</h3>
        </a>
        <ul class="topic">
            <li><a href="servicos.html">Serviços</a></li>
            <li><a href="#contato">Contatos</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </header>

    <main class="auth-container">
        <div class="auth-box">
            <h2>Acesse sua conta</h2>
            <p>Bem-vindo de volta à RTV Energia Solar</p>

            <form action="#" method="POST" class="auth-form">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Seu e-mail" required>
                </div>
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Sua senha" required>
                </div>
                <div class="auth-options">
                    <label><input type="checkbox"> Lembrar de mim</label>
                    <a href="#" class="forgot-password">Esqueceu a senha?</a>
                </div>
                <button type="submit" class="btn btn-full">Entrar</button>
            </form>

            <div class="divider">
                <span>ou continue com</span>
            </div>

            <div class="social-login">
                <button class="btn-social btn-google">
                    <i class="ph-fill ph-google-logo"></i> Google
                </button>
                <button class="btn-social btn-facebook">
                    <i class="ph-fill ph-facebook-logo"></i> Facebook
                </button>
                <button class="btn-social btn-apple">
                    <i class="ph-fill ph-apple-logo"></i> Apple
                </button>
            </div>

            <p class="auth-footer">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
        </div>
    </main>

    <footer id="contato">
        <ul class="contatos">
            <li><a href="https://www.facebook.com/rtvsolar">Facebook</a></li>
            <li><a href="https://www.instagram.com/rtvsolar">Instagram</a></li>
            <li><a href="https://www.linkedin.com/company/rtvsolar">LinkedIn</a></li>
        </ul>
        <p>&copy; 2026 RTV Solar. Todos os direitos reservados.</p>
    </footer>
</body>

</html>
