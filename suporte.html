<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="sistema-permissoes.js" defer></script>
    <script src="workflow-aprovacoes.js" defer></script>
    <script src="cliente-funcoes.js" defer></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <title>Suporte - RTV Solar</title>
</head>
<body class="pagina-painel">
    <header class="nav-bar">
        <a href="dashboard.html">
            <img src="imagens/logo-site.png" alt="logo" class="logo">
            <h3>RTV ENERGIA SOLAR</h3>
        </a>
        <div class="topbar-actions">
            <div class="notification-wrapper">
                <a href="#" id="btn-notificacoes" style="color: var(--amarelo-vivo); position: relative;">
                    <i class="ph ph-bell" style="font-size: 24px;"></i>
                    <span class="notif-badge" id="notif-count" style="display: none;">0</span>
                </a>
                <div class="notif-dropdown" id="notif-dropdown"></div>
            </div>
            <a href="#" id="btn-logout" class="btn" style="background-color: #ff5f56; padding: 8px 15px;">Sair</a>
        </div>
    </header>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <a href="dashboard.html"><i class="ph ph-squares-four"></i> Visão Geral</a>
            <a href="cliente-geracao.html"><i class="ph ph-lightning"></i> Geração</a>
            <a href="cliente-consumo.html"><i class="ph ph-activity"></i> Consumo em Tempo Real</a>
            <a href="cliente-financeiro.html"><i class="ph ph-trend-up"></i> Financeiro & Economia</a>
            <a href="cliente-contratos.html"><i class="ph ph-chart-line-up"></i> Contratos</a>
            <a href="relatorios.html"><i class="ph ph-chart-line-up"></i> Relatórios Financeiros</a>
            <a href="suporte.html" class="active"><i class="ph ph-headset"></i> Suporte & Chamados</a>
            <hr style="margin: 15px 0; border: none; border-top: 1px solid #444;">
            <a href="admin-clientes.html" class="sidebar-link-admin" style="display: none; color: #F4A222; font-weight: bold;"><i class="ph ph-user-gear"></i> 🔧 Gestão de Clientes</a>
        </aside>

        <main class="dashboard-content">
            <div class="dash-header">
                <h2>Meus Chamados</h2>
                <button class="btn" onclick="abrirModalChamado()">Abrir Novo Chamado</button>
            </div>

            <div id="form-chamado-area" style="display: none; background: #242424; padding: 20px; border-radius: 12px; margin-bottom: 30px;">
                <h3 style="color: var(--verde-agua);">Descreva o Problema</h3>
                <form id="form-novo-chamado" class="form-interno" data-permitir-submit>
                    <div class="input-group">
                        <label>Categoria</label>
                        <select id="cat-chamado">
                            <option>Inversor Offline</option>
                            <option>Queda de Geração</option>
                            <option>Dúvida Financeira</option>
                            <option>Outro</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Descrição detalhada</label>
                        <textarea id="desc-chamado" required></textarea>
                    </div>
                    <br>
                    <button type="submit" class="btn">Enviar Chamado</button>
                    <button type="button" class="btn-secundario" onclick="fecharModalChamado()">Cancelar</button>
                </form>
            </div>

            <div class="tabela-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Categoria</th>
                            <th>Data</th>
                            <th>Status</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-chamados"></tbody>
                </table>
            </div>

            <!-- Modal: Detalhes do Chamado -->
            <div id="modal-chamado-overlay" style="display:none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9999;">
                <div class="dash-card" style="max-width: 720px; width: calc(100% - 40px); margin: 10vh auto; background: #242424;">
                    <div style="display:flex; justify-content: space-between; align-items: center; gap: 15px;">
                        <h3 style="color: var(--verde-agua); margin: 0;">Detalhes do Chamado</h3>
                        <a href="#" id="modal-chamado-fechar" style="color: #aaa; text-decoration: none; font-size: 22px;">×</a>
                    </div>
                    <div style="height: 1px; background: rgba(255,255,255,0.06); margin: 15px 0 20px;"></div>

                    <div class="form-interno">
                        <div class="form-grid">
                            <div class="input-group">
                                <label>ID</label>
                                <input id="det-chamado-id" type="text" readonly>
                            </div>
                            <div class="input-group">
                                <label>Categoria</label>
                                <input id="det-chamado-categoria" type="text" readonly>
                            </div>
                        </div>
                        <div class="form-grid" style="margin-top: 10px;">
                            <div class="input-group">
                                <label>Data</label>
                                <input id="det-chamado-data" type="text" readonly>
                            </div>
                            <div class="input-group">
                                <label>Status</label>
                                <input id="det-chamado-status" type="text" readonly>
                            </div>
                        </div>
                        <div class="input-group" style="margin-top: 10px;">
                            <label>Descrição</label>
                            <textarea id="det-chamado-descricao" readonly style="min-height: 140px;"></textarea>
                        </div>
                        <div style="display:flex; justify-content: flex-end; gap: 10px; margin-top: 18px;">
                            <button type="button" id="btn-fechar-detalhe-chamado" class="btn-secundario">Fechar</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('btn-logout').addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.removeItem('rtv_usuario_logado');
        window.location.href = 'login.html';
    });
});
</script>
</body>
</html>
