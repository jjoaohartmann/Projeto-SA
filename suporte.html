<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <title>Suporte - RTV Solar</title>
</head>
<body class="pagina-painel">
    <header class="nav-bar">
        <a href="dashboard.html">
            <img src="imagens/logo-site.png" alt="logo" class="logo">
            <h3>RTV ENERGIA SOLAR</h3>
        </a>
        <ul class="topic">
            <li><a href="#" id="btn-logout" style="background-color: #ff5f56; color: white;">Sair</a></li>
        </ul>
    </header>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <a href="dashboard.html"><i class="ph ph-squares-four"></i> Visão Geral</a>
            <a href="monitoramento.html"><i class="ph ph-activity"></i> Monitoramento</a>
            <a href="relatorios.html"><i class="ph ph-chart-line-up"></i> Relatórios</a>
            <a href="suporte.html" class="active"><i class="ph ph-headset"></i> Suporte & Chamados</a>
            <a href="manutencao.html"><i class="ph ph-wrench"></i> Manutenção</a>
            <a href="configuracoes.html"><i class="ph ph-gear"></i> Configurações</a>
        </aside>

        <main class="dashboard-content">
            <div class="dash-header">
                <h2>Meus Chamados</h2>
                <button class="btn" onclick="abrirModalChamado()">Abrir Novo Chamado</button>
            </div>

            <div id="form-chamado-area" style="display: none; background: #242424; padding: 20px; border-radius: 12px; margin-bottom: 30px;">
                <h3 style="color: var(--verde-agua);">Descreva o Problema</h3>
                <form id="form-novo-chamado" class="form-interno">
                    <div class="input-group">
                        <label>Categoria</label>
                        <select id="cat-chamado">
                            <option>Inversor Offline</option>
                            <option>Queda de Geração</option>
                            <option>Dúvida Financeira</option>
                            <option>Outro</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Descrição detalhada</label>
                        <textarea id="desc-chamado" required></textarea>
                    </div>
                    <br>
                    <button type="submit" class="btn">Enviar Chamado</button>
                    <button type="button" class="btn-secundario" onclick="fecharModalChamado()">Cancelar</button>
                </form>
            </div>

            <div class="tabela-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Categoria</th>
                            <th>Data</th>
                            <th>Status</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-chamados">
                        <tr>
                            <td>#10024</td>
                            <td>Inversor Offline</td>
                            <td>15/04/2026</td>
                            <td><span class="badge aberto">Em Análise</span></td>
                            <td><a href="#" style="color: var(--verde-agua);">Ver Detalhes</a></td>
                        </tr>
                        <tr>
                            <td>#09871</td>
                            <td>Manutenção Preventiva</td>
                            <td>10/01/2026</td>
                            <td><span class="badge resolvido">Resolvido</span></td>
                            <td><a href="#" style="color: var(--verde-agua);">Ver Detalhes</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>
</html>
