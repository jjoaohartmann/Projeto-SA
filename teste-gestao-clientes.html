<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Admin Clientes - RTV</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .teste-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 40px;
            background: #222;
            border-radius: 8px;
            text-align: center;
        }
        .step {
            margin: 30px 0;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 4px;
            border-left: 4px solid #F4A222;
        }
        .step h3 {
            color: #F4A222;
            margin: 0 0 10px 0;
        }
        .step p {
            color: #aaa;
            margin: 10px 0;
            font-size: 14px;
        }
        .status-ok {
            color: #27c93f;
            font-weight: bold;
        }
        .status-error {
            color: #ff5f56;
            font-weight: bold;
        }
        button {
            background: #F4A222;
            color: #000;
            padding: 12px 30px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin: 10px;
            width: 100%;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body class="pagina-painel" style="background: #1a1a1a;">
    <div class="teste-container">
        <h1 style="color: #F4A222; margin-bottom: 30px;">🧪 Teste Admin Clientes</h1>
        
        <div class="step">
            <h3>1️⃣ Verificar Dados</h3>
            <p id="passo1">Checando localStorage...</p>
        </div>
        
        <div class="step">
            <h3>2️⃣ APIs JavaScript</h3>
            <p id="passo2">Checando APIs...</p>
        </div>
        
        <div class="step">
            <h3>3️⃣ Autenticação</h3>
            <p id="passo3">Checando autenticação...</p>
        </div>
        
        <div style="margin-top: 30px;">
            <button onclick="setupCompleto()">✅ Setup Completo (Limpar + Criar Dados + Login)</button>
            <button onclick="abrirAdmin()">📊 Abrir Gestão de Clientes</button>
        </div>
        
        <div id="resultado" style="margin-top: 30px;"></div>
    </div>

    <script src="script.js" defer></script>
    <script src="admin-clientes.js" defer></script>
    <script src="sistema-permissoes.js" defer></script>
    
    <script>
        function verificar() {
            // 1. Dados
            const usuarios = JSON.parse(localStorage.getItem("rtv_usuarios")) || [];
            const clientes = usuarios.filter(u => u.role === "cliente");
            document.getElementById("passo1").innerHTML = 
                `<span class="${usuarios.length > 0 ? 'status-ok' : 'status-error'}">
                    ${usuarios.length > 0 ? '✓' : '✗'} ${usuarios.length} usuários, ${clientes.length} clientes
                </span>`;
            
            // 2. APIs
            let apisOk = true;
            const apis = [];
            if (typeof AdminClientesAPI !== 'undefined') {
                apis.push('AdminClientesAPI');
            } else {
                apisOk = false;
            }
            if (typeof ehAdmin === 'function') {
                apis.push('ehAdmin()');
            } else {
                apisOk = false;
            }
            document.getElementById("passo2").innerHTML = 
                `<span class="${apisOk ? 'status-ok' : 'status-error'}">
                    ${apisOk ? '✓' : '✗'} ${apis.join(', ')}
                </span>`;
            
            // 3. Autenticação
            const usuarioLogado = obterUsuarioLogado();
            const isAdmin = ehAdmin();
            const status = usuarioLogado && isAdmin ? 'status-ok' : 'status-error';
            const texto = usuarioLogado && isAdmin ? `✓ ${usuarioLogado.nome} (admin)` : '✗ Não autenticado ou não é admin';
            document.getElementById("passo3").innerHTML = `<span class="${status}">${texto}</span>`;
            
            return usuarios.length > 0 && clientes.length > 0 && apisOk && usuarioLogado && isAdmin;
        }
        
        function setupCompleto() {
            localStorage.clear();
            sessionStorage.clear();
            
            // Criar dados
            if (typeof seedUsuariosPadrao === 'function') {
                seedUsuariosPadrao();
            }
            
            // Login como admin
            localStorage.setItem("rtv_usuario_logado", JSON.stringify({
                nome: "Administrador RTV",
                email: "admin@rtvsolar.com",
                senha: "admin123",
                role: "admin"
            }));
            
            document.getElementById("resultado").innerHTML = 
                '<div style="background: #27c93f; color: #000; padding: 15px; border-radius: 4px; font-weight: bold;">✅ Setup concluído! Redirecionando...</div>';
            
            setTimeout(() => {
                window.location.href = "admin-clientes.html";
            }, 1500);
        }
        
        function abrirAdmin() {
            const tudo_ok = verificar();
            if (!tudo_ok) {
                document.getElementById("resultado").innerHTML = 
                    '<div style="background: #ff5f56; color: #000; padding: 15px; border-radius: 4px; font-weight: bold;">⚠️ Dados incompletos! Execute "Setup Completo" primeiro.</div>';
                return;
            }
            window.location.href = "admin-clientes.html";
        }
        
        // Verificar ao carregar
        setTimeout(() => {
            verificar();
        }, 1500);
    </script>
</body>
</html>
