<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <title>Configurações - RTV Solar</title>
</head>
<body class="pagina-painel">
    <header class="nav-bar">
        <a href="dashboard.html">
            <img src="imagens/logo-site.png" alt="logo" class="logo">
            <h3>RTV ENERGIA SOLAR</h3>
        </a>
        <div class="topbar-actions">
            <div class="search-bar">
                <i class="ph ph-magnifying-glass"></i>
                <input type="text" placeholder="Buscar dispositivos, chamados...">
            </div>
            <div class="notification-wrapper">
                <a href="#" id="btn-notificacoes" style="color: var(--amarelo-vivo); position: relative;">
                    <i class="ph ph-bell" style="font-size: 24px;"></i>
                    <span class="notif-badge">3</span>
                </a>
                <div class="notif-dropdown" id="notif-dropdown"></div>
            </div>
            <a href="#" id="btn-logout" class="btn" style="background-color: #ff5f56; padding: 8px 15px;">Sair</a>
        </div>
    </header>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <a href="dashboard.html"><i class="ph ph-squares-four"></i> Visão Geral</a>
            <a href="monitoramento.html"><i class="ph ph-activity"></i> Monitorização em Tempo Real</a>
            <a href="dispositivos.html"><i class="ph ph-cpu"></i> Gestão de Ativos</a>
            <a href="analytics.html"><i class="ph ph-trend-up"></i> Analytics & KPIs</a>
            <a href="relatorios.html"><i class="ph ph-chart-line-up"></i> Relatórios Financeiros</a>
            <a href="suporte.html"><i class="ph ph-headset"></i> Suporte & Chamados</a>
            <a href="manutencao.html"><i class="ph ph-wrench"></i> Agendamentos</a>
            <a href="auditoria.html"><i class="ph ph-shield-check"></i> Logs e Auditoria</a>
            <a href="configuracoes.html" class="active"><i class="ph ph-gear"></i> Configurações do Sistema</a>
            <a href="admin.html" class="sidebar-link-admin" style="display: none;"><i class="ph ph-user-gear"></i> Administração</a>
        </aside>

        <main class="dashboard-content">
            <h2>Configurações do Sistema</h2>
            
            <div class="dash-card" style="margin-bottom: 20px;">
                <h3 style="color: var(--verde-agua); margin-bottom: 20px;">Perfil do Usuário</h3>
                <form class="form-interno">
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Nome Completo</label>
                            <input type="text" value="Usuário RTV Solar">
                        </div>
                        <div class="input-group">
                            <label>E-mail</label>
                            <input type="email" value="cliente@rtvsolar.com">
                        </div>
                    </div>
                    <button id="btn-salvar-perfil" type="button" class="btn" style="margin-top: 15px;">Salvar Alterações</button>
                </form>
            </div>

            <div class="dash-card">
                <h3 style="color: var(--verde-agua); margin-bottom: 20px;">Segurança</h3>
                <form class="form-interno">
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Nova Senha</label>
                            <input type="password" placeholder="Digite a nova senha">
                        </div>
                        <div class="input-group">
                            <label>Confirmar Senha</label>
                            <input type="password" placeholder="Repita a nova senha">
                        </div>
                    </div>
                    <button id="btn-alterar-senha" type="button" class="btn-secundario" style="margin-top: 15px; border-color: var(--amarelo-vivo); color: var(--amarelo-vivo);">Alterar Senha</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
